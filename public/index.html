<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. Include the Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            /* Telegram passes theme colors via CSS variables automatically */
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        button {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>
  <h2>My First Mini App. Hey</h2>
  <button id="sendBtn">Login</button>
  <h3 id="response"></h3>

  <dialog id="lineDialog">
    <h3>Create Line</h3>
    <input
      type="text"
      id="lineName"
      placeholder="Line name"
      required
    >

    <input
      type="date"
      id="lineDate"
      required
    > <br><br>

    <button onclick="createLine()">Create</button>
    <button onclick="lineDialog.close()">Cancel</button>
  </dialog>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const userId = tg.initDataUnsafe?.user?.id;
    const username = tg.initDataUnsafe?.user?.username;
    const firstName = tg.initDataUnsafe?.user?.first_name;
    const lastName = tg.initDataUnsafe?.user?.last_name;

    responseH3 = document.getElementById("response");

    // not really needed
    if (userId)
    {
      fetch('/api/app_opened', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          initData: tg.initData,
        })
      }).then(res => {
        if (!res.ok) throw new Error(`Server status: ${res.status}`);
        return res.json();
      }).then(data => {
        responseH3.innerText = data.message;
      }).catch(error => {
        console.error("Failed to send: ", error);
      });
    } else
    {
      console.log("Not running inside Telegram.");
    }

    const lineDialog = document.getElementById("lineDialog");

    function openDialog() {
      lineDialog.showModal();
    }

    function createLine() {
      const lineName = document.getElementById("lineName").value;
      const lineDate = document.getElementById("lineDate").value;

      fetch('/api/add_line', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          initData: tg.initData,
          line_name: lineName,
          line_date: lineDate
        })
      }).then(res => {
        if (!res.ok) throw new Error(`Server status: ${res.status}`);
        return res.json();
      }).then(data => {
        Telegram.WebApp.showAlert("Line created successfully!");
      }).catch(error => {
        console.error("Failed to send: ", error);
        Telegram.WebApp.showAlert("Error. the line wasn't created!");
      });

      lineDialog.close();
    }

    openDialog();

  </script>
</body>
</html>
