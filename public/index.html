<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            /* Telegram passes theme colors via CSS variables automatically */
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        button {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>
  <h2>Defence Line Manager</h2>
  <button onclick="openLineDialog()">Create new line</button>
  <button id="newUserButton"
          style="display: none;"
          onclick="openNewUserDialog()">
            Add new user
  </button>
  <h3 style="display: none;" id="response"></h3>

  <dialog id="lineDialog">
    <h3>Create Line</h3>
    <input
      type="text"
      id="courseName"
      placeholder="Course name"
      required
    > <br><br>
    <input
      type="text"
      id="lineName"
      placeholder="Line name"
      required
    > <br><br>
    Date:
    <input
      type="date"
      id="defenceDate"
      required
    > <br><br>

    <button onclick="createLine()">Create</button>
    <button onclick="lineDialog.close()">Cancel</button>
  </dialog>

  <dialog id="newUserDialog">
    <h3>Add new user</h3>
    <input
      type="text"
      id="newUserTgId"
      placeholder="Telegram ID"
      required
    > <br><br>
    <input
      type="text"
      id="newUserName"
      placeholder="Username"
      required
    > <br><br>
    <input
      type="text"
      id="newUserFirstName"
      placeholder="First Name"
      required
    > <br><br>
    <input
      type="text"
      id="newUserLastName"
      placeholder="Last Name"
    > <br><br>

    <button onclick="addUser()">Add</button>
    <button onclick="newUserDialog.close()">Cancel</button>
  </dialog>

  <h3>Upcoming lines:</h3>

  <table id="linesTable">
    <thead>
      <tr>
        <th>Course</th>
        <th>Line name</th>
        <th>Defence date</th>
        <th>Open</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const userId = tg.initDataUnsafe?.user?.id;
    const username = tg.initDataUnsafe?.user?.username;
    const firstName = tg.initDataUnsafe?.user?.first_name;
    const lastName = tg.initDataUnsafe?.user?.last_name;

    is_admin = false;

    newUserButton = document.getElementById("newUserButton");
    responseH3 = document.getElementById("response");

    if (userId)
    {
      fetch('/api/app_opened', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          initData: tg.initData,
        })
      }).then(res => {
        return res.json();
      }).then(data => {
        is_admin = data.is_admin;
        if (is_admin) {
          newUserButton.style.display = "inline-block";
        }
        responseH3.innerText = "is_admin: " + data.is_admin;
      }).catch(error => {
        console.error("Failed to send: ", error);
      });
    } else
    {
      console.log("Not running inside Telegram.");
    }

    linesTableBody = document.getElementById("linesTable").tBodies[0];

    function getLines() {
      fetch('/api/get_lines', {
        method: 'GET'
      }).then(res => {
        return res.json();
      }).then(data => {
        responseH3.innerText = data.lines.length;
        linesTableBody.innerHTML = '';
        data.lines.forEach(line => {
          let row = linesTableBody.insertRow();
          row.insertCell().textContent = line.course_name;
          row.insertCell().textContent = line.line_name;
          row.insertCell().textContent = line.defence_date;
          let newButton = document.createElement('BUTTON');
          newButton.innerText = "->";
          newButton.onclick = function() {redirectLine(line.line_id)};
          row.insertCell().appendChild(newButton);
        });
      }).catch(error => {
        console.error("Failed to retireve data: ", error);
        Telegram.WebApp.showAlert("Failed to get line data!");
      });
    }

    getLines();

    const lineDialog = document.getElementById("lineDialog");

    function openLineDialog() {
      lineDialog.showModal();
    }

    function redirectLine(lineId) {
      window.location.href = "/line?line_id=" + lineId;
    }

    function createLine() {
      const courseName = document.getElementById("courseName").value;
      const lineName = document.getElementById("lineName").value;
      const defenceDate = document.getElementById("defenceDate").value;

      fetch('/api/new_line', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          initData: tg.initData,
          course_name: courseName,
          line_name: lineName,
          defence_date: defenceDate
        })
      }).then(res => {
       return res.json();
      }).then(data => {
        Telegram.WebApp.showAlert(data.message);
        getLines();
      }).catch(error => {
        console.error("Failed to send: ", error);
        Telegram.WebApp.showAlert("Server error: " + error.message);
      });

      lineDialog.close();
    }

    const newUserDialog = document.getElementById("newUserDialog");

    function openNewUserDialog() {
      newUserDialog.showModal();
    }

    function addUser() {
      if (!is_admin) {
        Telegram.WebApp.showAlert("Not an admin!");
        return;
      }

      const newUserTgId = Number(document.getElementById("newUserTgId").value);
      const newUserName = document.getElementById("newUserName").value;
      const newUserFirstName = document.getElementById("newUserFirstName").value;
      const newUserLastName = document.getElementById("newUserLastName").value;

      fetch('/api/admin/new_user', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          initData: tg.initData,
          new_user: {
            telegram_id: newUserTgId,
            username: newUserName,
            first_name: newUserFirstName,
            last_name: newUserLastName
          }
        })
      }).then(res => {
       return res.json();
      }).then(data => {
        Telegram.WebApp.showAlert(data.message);
      }).catch(error => {
        console.error("Failed to send: ", error);
        Telegram.WebApp.showAlert("Server error: " + error.message);
      });
    }
  </script>
</body>
</html>
