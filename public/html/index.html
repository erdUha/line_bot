<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <h2>Defence Line Manager</h2>
  <button onclick="openLineDialog()">Create new line</button>
  <button id="newUserButton"
          style="display: none;"
          onclick="openNewUserDialog()">
            Add new user
  </button>
  <h3 style="display: none;" id="response"></h3>

  <dialog id="newLineDialog">
    <h3>Create Line</h3>
    <input
      type="text"
      id="courseName"
      placeholder="Course name"
      required
    > <br><br>
    <input
      type="text"
      id="lineName"
      placeholder="Assignment name"
      required
    > <br><br>
    Group Work: <input
      type="checkbox"
      id="isGroupWork"
      required
    > <br><br>
    Date:
    <input
      type="date"
      id="defenceDate"
      required
    > <br><br>

    <button onclick="createLine()">Create</button>
    <button onclick="newLineDialog.close()">Cancel</button>
  </dialog>

  <dialog id="newUserDialog">
    <h3>Add new user</h3>
    <input
      type="text"
      id="newUserTgId"
      placeholder="Telegram ID"
      required
    > <br><br>
    <input
      type="text"
      id="newUserName"
      placeholder="Username"
      required
    > <br><br>
    <input
      type="text"
      id="newUserFirstName"
      placeholder="First Name"
      required
    > <br><br>
    <input
      type="text"
      id="newUserLastName"
      placeholder="Last Name"
    > <br><br>

    <button onclick="addUser()">Add</button>
    <button onclick="newUserDialog.close()">Cancel</button>
  </dialog>

  <h3>Upcoming lines:</h3>

  <table id="linesTable">
    <thead>
      <tr>
        <th>Course</th>
        <th>Line name</th>
        <th>Defence date</th>
        <th>Open</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="scripts/index.js"></script>
</body>
</html>
