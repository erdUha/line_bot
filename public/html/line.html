<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <button onclick='window.location.href = "/"'>Back</button>
  <button onclick='openReserveDialog()'>Reserve a Spot</button>
  <button id="removeMySpotButton"
          style="display: none;"
          onclick='openReservationRemovalConfirmationDialog()'>
            Remove My Spot
  </button>
  <button id="removeLineButton"
          onclick='openLineRemovalConfirmationDialog()'
          style="display: none;">
            Remove Line
  </button>
  <h2 id="lineName"></h2>
  <h4 id="courseName"></h4>
  <h5 id="creator"></h5>

  <table id="reservationsTable">
    <thead>
      <tr>
        <th>Position</th>
        <th id="studentColumn">Student</th>
        <th id="joinGroupColumn"
            style="display: none;">
              Join Group
        </th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <dialog id="reserveDialog">
    <h3>Reserve a Spot</h3>
    Position:&nbsp
    <input
      type="number"
      id="position"
      min="1" step="1"
      value="1"
      required
    > <br><br>

    <button onclick="createReservation()">Reserve</button>
    <button onclick="reserveDialog.close()">Cancel</button>
  </dialog>

  <dialog id="lineRemovalConfirmationDialog">
    <h3>Are you deadass?</h3>
    <button onclick="removeLine()">Yes</button>
    <button onclick="lineRemovalConfirmationDialog.close()">No</button>
  </dialog>

  <dialog id="reservationRemovalConfirmationDialog">
    <h3>Are you deadass?</h3>
    <p id="positionToDelete"></p>
    <button onclick="removeMySpot()">Yes</button>
    <button onclick="reservationRemovalConfirmationDialog.close()">No</button>
  </dialog>

  <script src="scripts/line.js"></script>
</body>
</html>
