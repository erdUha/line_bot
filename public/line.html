<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            /* Telegram passes theme colors via CSS variables automatically */
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        button {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>
<button onclick='window.location.href = "/"'>back</button>
<h2 id="lineName"></h2>
<h4 id="courseName"></h4>
<h4 id="creator"></h4>

<script>
  const params = new URLSearchParams(window.location.search);

  const lineId = params.get('line_id');

  const lineName = document.getElementById('lineName');
  const courseName = document.getElementById('courseName');
  const creator = document.getElementById('creator');

  function getLine(lineId) {
    fetch('/api/get_lines?line_id=' + encodeURIComponent(lineId), {
      method: 'GET'
    }).then(res => {
      return res.json();
    }).then(data => {
      lineName.innerText = "Line: " + data.line.line_name;
      courseName.innerText = "Course: " + data.line.course_name;
      creator.innerText = "Creator: " + data.line.creator_username;
    }).catch(error => {
      console.error("Failed to retireve data: ", error);
      Telegram.WebApp.showAlert("Failed to get line data!: " + error);
    });
  }

  getLine(lineId);
</script>
</body>
</html>
